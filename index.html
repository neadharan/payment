<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Consumer Data</title>

<style>
body { font-family: Arial; margin: 0; background: #d6dde6; }

.header { display:flex; background:#3e69ad; color:rgb(223, 198, 198); padding:10px; align-items:center; }
.logo { width:60px; border-radius:50%; }
.title { flex:1; text-align:center; }
.title h2,.title h3 {margin: 2px 0;}

.home { background:#5f6f89; padding:5px 10px; cursor:pointer; border-radius:5px; }

.icons {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  padding:10px;
  background:#d9e1ec;
}

.icon {
  text-align:center;
  cursor:pointer;
  background:#d6dde6;
  border-radius:10px;
  padding:8px;
}

.icon img { width:40px; height:40px; }

.selectedMenu {
  display:none;
  padding:10px;
  background:#d9e1ec;
}

.panel {
  display:none;
  background:#e6edf5;
  margin:10px;
  padding:10px;
}

input, select { padding:6px; margin:3px; }
button { padding:6px; margin:3px; }

.table-box { background:white; margin:10px; padding:10px; }

table { width:100%; border-collapse:collapse; }

th { background:#5f6f89; color:white; }

td, th { border:1px solid #ccc; padding:5px; }

.card {
  background:white;
  margin:10px;
  padding:10px;
  border-radius:10px;
}

.avgbox {
  background:#fff3cd;
  border:1px solid #e0c36b;
  border-radius:8px;
  padding:8px 12px;
  margin-top:8px;
  display:inline-block;
  font-weight:bold;
}
</style>

</head>
<body>

<div class="header">
  <img src="nea.gif" class="logo">
  <div class="title">
    <h2>Nepal Elecricity Authority</h2>
    <h2>Dharan Dcs</h2>
    <h3>Consumer Details & Payment_Due Check</h3>
  </div>
  <div class="home" onclick="goHome()">Home</div>
</div>

<div class="icons" id="iconsBox">
  <div class="icon" onclick="openMenu('payment')"><img src="t1.gif"><br>Payment</div>
  <div class="icon" onclick="openMenu('history')"><img src="t2.gif"><br>History</div>
  <div class="icon" onclick="openMenu('report')"><img src="icon1.gif"><br>Report</div>
  <div class="icon" onclick="openMenu('Test App')"><img src="icon2.gif"><br>Test App</div>
  <div class="icon" onclick="openMenu('Test App')"><img src="icon5.gif"><br>Test App</div>
  <div class="icon" onclick="openMenu('Test App')"><img src="icon6.gif"><br>Test App</div>
  <div class="icon" onclick="openMenu('Test App')"><img src="icon7.gif"><br>Test App</div>
  <div class="icon" onclick="openMenu('Test App')"><img src="icon8.gif"><br>Test App</div>
</div>

<div class="selectedMenu" id="selectedMenu"></div>

<div class="panel" id="searchPanel">
  ID: <input type="text" id="idSearch">
  SCNO: <input type="text" id="scnoSearch">
  <button onclick="searchData()">Search</button>
</div>

<div class="panel" id="reportPanel">
  Area: <select id="areaSelect"></select>
  Route: <select id="routeSelect"></select>
  Unit Range: <input type="number" id="unitMin" placeholder="Min" style="width:70px;">
  to <input type="number" id="unitMax" placeholder="Max" style="width:70px;">
  <button onclick="searchReport()">Search</button>
  <button onclick="clearReport()">Clear</button>

  <hr>

  RDG Year: <select id="yearSelect"></select>
  Month (आधार): <select id="monthASelect"></select>
  Month (तुलना): <select id="monthBSelect"></select>
  <button onclick="checkRdgStatus()">RDG Status हेर्नुहोस्</button>
</div>

<div id="output"></div>

<script>
let paymentData = [];
let historyData = [];
let mode = "";

// 🔥 SAFE LOAD (GitHub FIX)
function loadAllData() {
  let t = new Date().getTime();

  fetch("./dharan.csv?v="+t)
    .then(r=>{
      if(!r.ok) throw "CSV1 not found";
      return r.text();
    })
    .then(t=>paymentData=t.split("\n").map(r=>r.split(",")))
    .catch(e=>console.log("Payment CSV Error:",e));

  fetch("./dharan1.csv?v="+t)
    .then(r=>{
      if(!r.ok) throw "CSV2 not found";
      return r.text();
    })
    .then(t=>{
      historyData=t.split("\n").map(r=>r.split(","));
    })
    .catch(e=>console.log("History CSV Error:",e));
}
loadAllData();

// Build fixed Year (2083-2125) and Month (1-12) dropdown options
function populateYearMonthSelects(){
  let yearSel = document.getElementById("yearSelect");
  yearSel.innerHTML = "<option value=''>-- Select Year --</option>";
  for(let y=2083;y<=2125;y++){
    let opt = document.createElement("option");
    opt.value = String(y);
    opt.text = String(y);
    yearSel.appendChild(opt);
  }

  let monthOptionsHtml = "<option value=''>-- Select Month --</option>";
  for(let m=1;m<=12;m++){
    monthOptionsHtml += "<option value='"+m+"'>Month-"+m+"</option>";
  }

  document.getElementById("monthASelect").innerHTML = monthOptionsHtml;
  document.getElementById("monthBSelect").innerHTML = monthOptionsHtml;
}

// 🔥 FIX: wait DOM ready
document.addEventListener("DOMContentLoaded",function(){

  document.querySelectorAll(".icon").forEach(icon=>{
    icon.addEventListener("click",function(){
      document.getElementById("iconsBox").style.display="none";

      document.getElementById("selectedMenu").style.display="block";
      document.getElementById("selectedMenu").innerHTML=this.outerHTML;
    });
  });

  // Populate Area dropdown: 001 to 018
  let areaSel = document.getElementById("areaSelect");
  let areaDefault = document.createElement("option");
  areaDefault.value = "";
  areaDefault.text = "-- Select Area --";
  areaSel.appendChild(areaDefault);
  for(let i=1;i<=18;i++){
    let val = String(i).padStart(3,"0");
    let opt = document.createElement("option");
    opt.value = val;
    opt.text = val;
    areaSel.appendChild(opt);
  }

  // Populate Route dropdown: Route-1 to Route-29
  let routeSel = document.getElementById("routeSelect");
  let routeDefault = document.createElement("option");
  routeDefault.value = "";
  routeDefault.text = "-- Select Route --";
  routeSel.appendChild(routeDefault);
  for(let i=1;i<=29;i++){
    let opt = document.createElement("option");
    opt.value = String(i);
    opt.text = "Route-"+i;
    routeSel.appendChild(opt);
  }

  // Populate RDG Year (2083-2125) and Month (1-12) dropdowns
  populateYearMonthSelects();

});

// MENU OPEN
function openMenu(m){
  mode = m;
  document.getElementById("searchPanel").style.display="none";
  document.getElementById("reportPanel").style.display="none";
  document.getElementById("output").innerHTML="";
  document.getElementById("idSearch").value="";
  document.getElementById("scnoSearch").value="";

  if(m==="payment" || m==="history"){
    document.getElementById("searchPanel").style.display="block";
  }

  if(m==="report"){
    document.getElementById("reportPanel").style.display="block";
    document.getElementById("areaSelect").value="";
    document.getElementById("routeSelect").value="";
    document.getElementById("unitMin").value="";
    document.getElementById("unitMax").value="";
    document.getElementById("yearSelect").value="";
    document.getElementById("monthASelect").value="";
    document.getElementById("monthBSelect").value="";
  }

  if(m==="Test App"){
    document.getElementById("searchPanel").style.display="none";
    document.getElementById("output").innerHTML="<div class='table-box'></div>";
  }
}

// HOME
function goHome(){
  mode="";
  document.getElementById("output").innerHTML="";
  document.getElementById("searchPanel").style.display="none";
  document.getElementById("reportPanel").style.display="none";

  document.getElementById("iconsBox").style.display="grid";
  document.getElementById("selectedMenu").style.display="none";
  document.getElementById("selectedMenu").innerHTML="";
}

// SEARCH FUNCTION (same)
function searchData(){
  let idVal=document.getElementById("idSearch").value.trim();
  let scnoVal=document.getElementById("scnoSearch").value.trim().toLowerCase();

  let html="";
  let total=0;

  if(mode==="payment"){
    html+="<div class='table-box'><table>";
    html+="<tr><th>SCNO</th><th>ID</th><th>NAME</th><th>MONTH</th><th>DUE</th><th>PENALTY & REBATE</th><th>TOTAL</th></tr>";

    for(let i=1;i<paymentData.length;i++){
      let r=paymentData[i];

      let id=r[1]?.trim();
      let scno=r[0]?.trim().toLowerCase();

      if((idVal && id===idVal)||(scnoVal && scno===scnoVal)){
        html+="<tr>";
        html+="<td>"+r[0]+"</td>";
        html+="<td>"+r[1]+"</td>";
        html+="<td>"+r[2]+"</td>";
        html+="<td>"+r[5]+"</td>";
        html+="<td>"+r[8]+"</td>";
        html+="<td>"+r[10]+"</td>";
        html+="<td>"+r[11]+"</td>";
        html+="</tr>";

        let amt=parseFloat(r[11]);
        if(!isNaN(amt)) total+=amt;
      }
    }

    html+="</table><h3>Total Amount: "+total+"</h3></div>";
  }

  if(mode==="history"){
    for(let i=1;i<historyData.length;i++){
      let r=historyData[i];

      let id=r[0]?.trim();
      let scno=r[1]?.trim().toLowerCase();

      if((idVal && id===idVal)||(scnoVal && scno===scnoVal)){
        html+="<div class='card'>";
        html+="<h3>"+r[2]+"</h3>";
        html+="<p>ID:- "+r[0]+"</p>";
        html+="<p>SCNO:- "+r[1]+"</p>";
        html+="<p>Present_Rdg:- "+r[3]+"</p>";
        html+="<p>Prve_Rdg:- "+r[4]+"</p>";
        html+="<p>Rdg_Year:- "+r[5]+"</p>";
        html+="<p>Rdg_Month:- "+r[6]+"</p>";
        html+="<p>CATEGORY:- "+r[9]+"</p>";
        html+="<p>LOAD:- "+r[13]+"</p>";
        html+="<p>Meter_No:- "+r[16]+"</p>";
        html+="</div>";
      }
    }
  }

  document.getElementById("output").innerHTML=html;
}

// Helper: extract leading number from a string like "01", "01kha1", "023KHA1" -> 1, 1, 23
// Returns NaN if no leading digits found
function extractLeadingNumber(str){
  if(!str) return NaN;
  let m = String(str).trim().match(/^(\d+)/);
  return m ? parseInt(m[1],10) : NaN;
}

// REPORT SEARCH FUNCTION
// SCNO format expected: AREA.ROUTE.SEQ  e.g. 001.23.034  (SEQ may contain letters, e.g. 001.01.02kha1)
function searchReport(){
  let areaVal = document.getElementById("areaSelect").value.trim();
  let routeVal = document.getElementById("routeSelect").value.trim();
  let unitMinVal = document.getElementById("unitMin").value.trim();
  let unitMaxVal = document.getElementById("unitMax").value.trim();

  let unitMin = unitMinVal !== "" ? parseFloat(unitMinVal) : null;
  let unitMax = unitMaxVal !== "" ? parseFloat(unitMaxVal) : null;

  if(!areaVal && !routeVal && unitMin===null && unitMax===null){
    document.getElementById("output").innerHTML = "<p style='margin:10px;'>कृपया Area, Route वा Unit Range मध्ये कुनै एउटा छान्नुहोस्।</p>";
    return;
  }

  let html = "<div class='table-box'><table>";
  html += "<tr><th>SCNO</th><th>ID</th><th>NAME</th><th>PREV_RDG</th><th>PRESENT_RDG</th><th>UNIT</th><th>RDG_YEAR</th><th>RDG_MONTH</th><th>CATEGORY</th><th>LOAD</th><th>AVG UNIT</th></tr>";

  let unitSum = 0;
  let count = 0;

  for(let i=1;i<historyData.length;i++){
    let r = historyData[i];
    if(!r || r.length < 16) continue;

    let scno = r[1]?.trim();
    if(!scno) continue;

    let parts = scno.split(".");
    let area = parts[0]?.trim();
    let route = parts[1]?.trim();

    // Compare using only the leading numeric part, so formats like
    // "01", "1", "01kha1", "023KHA1" all match correctly regardless of
    // leading zeros or letters attached to area/route/seq.
    let areaNum = extractLeadingNumber(area);
    let routeNum = extractLeadingNumber(route);

    let areaMatch = areaVal ? (areaNum === parseInt(areaVal,10)) : true;
    let routeMatch = routeVal ? (routeNum === parseInt(routeVal,10)) : true;

    let avgUnitCol = r[15] !== undefined ? r[15].trim() : ""; // Column P (index 15)
    let avgUnitNum = parseFloat(avgUnitCol);

    // Unit Range filter based on the Average Unit column
    let rangeMatch = true;
    if(unitMin!==null || unitMax!==null){
      if(isNaN(avgUnitNum)){
        rangeMatch = false;
      } else {
        if(unitMin!==null && avgUnitNum < unitMin) rangeMatch = false;
        if(unitMax!==null && avgUnitNum > unitMax) rangeMatch = false;
      }
    }

    if(areaMatch && routeMatch && rangeMatch){
      let prevRdg = parseFloat(r[4]);
      let presentRdg = parseFloat(r[3]);
      let unit = (!isNaN(prevRdg) && !isNaN(presentRdg)) ? (presentRdg - prevRdg) : "";

      html += "<tr>";
      html += "<td>"+r[1]+"</td>";
      html += "<td>"+r[0]+"</td>";
      html += "<td>"+r[2]+"</td>";
      html += "<td>"+r[4]+"</td>";
      html += "<td>"+r[3]+"</td>";
      html += "<td>"+unit+"</td>";
      html += "<td>"+r[5]+"</td>";
      html += "<td>"+r[6]+"</td>";
      html += "<td>"+r[9]+"</td>";
      html += "<td>"+r[13]+"</td>";
      html += "<td>"+avgUnitCol+"</td>";
      html += "</tr>";

      if(unit !== "" && !isNaN(unit)){
        unitSum += unit;
        count++;
      }
    }
  }

  html += "</table></div>";

  document.getElementById("output").innerHTML = html;
}

function clearReport(){
  document.getElementById("areaSelect").value = "";
  document.getElementById("routeSelect").value = "";
  document.getElementById("unitMin").value = "";
  document.getElementById("unitMax").value = "";
  document.getElementById("yearSelect").value = "";
  document.getElementById("monthASelect").value = "";
  document.getElementById("monthBSelect").value = "";
  document.getElementById("output").innerHTML = "";
}

// RDG STATUS CHECK
// Compares two RDG months (for selected Area/Route/Year) and shows how many
// consumers had RDG done in Month A vs Month B, plus how many from Month A
// are still PENDING (not yet read) in Month B. Clicking the pending count
// reveals the list of those specific consumers.
function checkRdgStatus(){
  let areaVal = document.getElementById("areaSelect").value.trim();
  let routeVal = document.getElementById("routeSelect").value.trim();
  let yearVal = document.getElementById("yearSelect").value.trim();
  let monthAVal = document.getElementById("monthASelect").value.trim();
  let monthBVal = document.getElementById("monthBSelect").value.trim();

  if(!yearVal || !monthAVal || !monthBVal){
    document.getElementById("output").innerHTML = "<p style='margin:10px;'>कृपया RDG Year, Month (आधार) र Month (तुलना) तीनैवटा छान्नुहोस्।</p>";
    return;
  }

  let listA = [];
  let listB = [];

  for(let i=1;i<historyData.length;i++){
    let r = historyData[i];
    if(!r || r.length < 16) continue;

    let scno = r[1]?.trim();
    if(!scno) continue;

    let parts = scno.split(".");
    let area = parts[0]?.trim();
    let route = parts[1]?.trim();

    let areaNum = extractLeadingNumber(area);
    let routeNum = extractLeadingNumber(route);

    let areaMatch = areaVal ? (areaNum === parseInt(areaVal,10)) : true;
    let routeMatch = routeVal ? (routeNum === parseInt(routeVal,10)) : true;
    if(!areaMatch || !routeMatch) continue;

    let y = r[5]?.trim();
    let m = r[6]?.trim();

    if(y === yearVal && m === monthAVal) listA.push(r);
    if(y === yearVal && m === monthBVal) listB.push(r);
  }

  // Build a lookup of consumers already read in Month B (by ID + SCNO)
  let idsInB = new Set(listB.map(r => (r[0]?.trim()||"") + "|" + (r[1]?.trim()||"")));

  // Consumers read in Month A but NOT yet read in Month B = pending
  let pendingList = listA.filter(r => !idsInB.has((r[0]?.trim()||"") + "|" + (r[1]?.trim()||"")));

  let html = "<div class='table-box'>";
  html += "<h3>RDG Status - Year: "+yearVal+"</h3>";
  html += "<p>Month-"+monthAVal+" मा RDG भएका जम्मा Consumer: <b>"+listA.length+"</b></p>";
  html += "<p>Month-"+monthBVal+" मा RDG भएका जम्मा Consumer: <b>"+listB.length+"</b></p>";
  html += "<p>Month-"+monthAVal+" को आधारमा, Month-"+monthBVal+" मा RDG हुन बाँकी Consumer: ";
  html += "<span onclick=\"togglePendingList()\" style='color:#3e69ad; text-decoration:underline; cursor:pointer; font-weight:bold;'>"+pendingList.length+"</span></p>";

  html += "<div id='pendingListBox' style='display:none; margin-top:10px;'>";
  if(pendingList.length > 0){
    html += "<table>";
    html += "<tr><th>SCNO</th><th>ID</th><th>NAME</th><th>CATEGORY</th><th>LOAD</th></tr>";
    pendingList.forEach(r=>{
      html += "<tr>";
      html += "<td>"+r[1]+"</td>";
      html += "<td>"+r[0]+"</td>";
      html += "<td>"+r[2]+"</td>";
      html += "<td>"+r[9]+"</td>";
      html += "<td>"+r[13]+"</td>";
      html += "</tr>";
    });
    html += "</table>";
  } else {
    html += "<p>कुनै पनि consumer बाँकी छैन।</p>";
  }
  html += "</div>";
  html += "</div>";

  document.getElementById("output").innerHTML = html;
}

function togglePendingList(){
  let box = document.getElementById("pendingListBox");
  box.style.display = (box.style.display === "none") ? "block" : "none";
}
</script>

</body>
</html>
